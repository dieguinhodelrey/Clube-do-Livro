<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni4Read</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <aside class="sidebar">


        <div class="sidebar-logo">
            <img src="assets/unisinos-logo.webp" alt="Unisinos">
        </div>


        <button class="add-book-button">
            <span class="add-icon">+</span>
            <span>Adicionar livro</span>
        </button>


        <nav class="sidebar-menu">

            <a href="feed.html" class="sidebar-item active">
                <span class="sidebar-icon">
                    <img src="./assets/home.png" alt="Feed">
                </span>
                <span>Feed</span>
            </a>

            <a href="lidos.html" class="sidebar-item">
                <span class="sidebar-icon">
                    <img src="./assets/Lido.png" alt="Feed">
                </span>
                <span>Lidos</span>
            </a>

            <a href="lendo.html" class="sidebar-item">
                <span class="sidebar-icon">
                    <img src="./assets/lendo.png" alt="Feed">
                </span>
                <span>Lendo</span>
            </a>

            <a href="amigos.html" class="sidebar-item">
                <span class="sidebar-icon">
                    <img src="./assets/Amigos.png" alt="Feed">
                </span>
                <span>Amigos</span>
            </a>

        </nav>


        <div class="sidebar-bottom">
            <button class="profile-button">
                <span>👤</span>
                <span>Perfil</span>
            </button>
        </div>

    </aside>



<main class="main">
    <section class="content">
        <div class="page-header">
            <h1>Feed</h1>
        </div>

        <div class="feed"></div>
    </section>
</main>

<div class="modal-overlay" id="addBookOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2>Adicionar livro</h2>
            <button class="modal-close" id="addBookClose" type="button">✕</button>
        </div>

        <form id="addBookForm">

            <label class="field">
                <span>Título do livro</span>
                <input type="text" id="fieldTitulo" name="titulo" placeholder="Ex: O Hobbit" required>
            </label>

            <label class="field">
                <span>Autor</span>
                <input type="text" id="fieldAutor" name="autor" placeholder="Ex: J. R. R. Tolkien" required>
            </label>

            <label class="field">
                <span>Status</span>
                <select id="fieldStatus" name="status">
                    <option value="lendo">Lendo</option>
                    <option value="lido">Lido</option>
                </select>
            </label>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="addBookCancel">Cancelar</button>
                <button type="submit" class="btn-primary">Adicionar</button>
            </div>

        </form>
    </div>
</div>

<div class="modal-overlay" id="statusOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2>Alterar status</h2>
            <button class="modal-close" id="statusClose" type="button">✕</button>
        </div>

        <div class="status-options">

            <button type="button" class="status-option" id="statusLendo" data-status="lendo">
                <span class="status-option-icon">📖</span>
                <span>Lendo</span>
            </button>

            <button type="button" class="status-option" id="statusLido" data-status="lido">
                <span class="status-option-icon">✅</span>
                <span>Lido</span>
            </button>

        </div>

        <div class="rating-section" id="ratingSection">
            <span class="field-label">Sua avaliação</span>

            <div class="star-picker" id="starPicker">
                <button type="button" class="star-button" data-value="1">★</button>
                <button type="button" class="star-button" data-value="2">★</button>
                <button type="button" class="star-button" data-value="3">★</button>
                <button type="button" class="star-button" data-value="4">★</button>
                <button type="button" class="star-button" data-value="5">★</button>
            </div>
        </div>

        <div class="modal-actions">
            <button type="button" class="btn-secondary" id="statusCancel">Cancelar</button>
            <button type="button" class="btn-primary" id="statusConfirm">Salvar</button>
        </div>

    </div>
</div>

<script src="script.js"></script>

</body>

</html>
