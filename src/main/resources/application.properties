spring.application.name=uni4read
spring.datasource.url=jdbc:h2:mem:uni4read;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
auth.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
auth.jwt.access-token-expiration-minutes=15
auth.jwt.refresh-token-expiration-days=7
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
